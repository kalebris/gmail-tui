[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmail-tui"
version = "0.1.0"
description = "Online-first Gmail client: local metadata replica, body cache, and sync loops"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gmail-tui = "gmail_tui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["gmail_tui"]

# Non-.py data next to the package (Store loads schema.sql beside store.py).
[tool.hatch.build.targets.wheel.force-include]
"gmail_tui/schema.sql" = "gmail_tui/schema.sql"

[tool.uv]
package = true
